spring.application.name=kinetic-backend

# Deploy uma cópia por vez: ao parar, termina as requisições em andamento antes de sair
# (o docker-compose dá 30 s antes de matar o processo).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Os avisos do painel são lidos a cada segundo; com 1 thread (padrão), uma limpeza
# demorada travaria essa leitura.
spring.task.scheduling.pool.size=4

# Supabase PostgreSQL Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pooler em modo sessão (5432): cada conexão do Hikari ocupa uma vaga do pooler (Nano: 15).
# 2 cópias × 5 = 10, sobram 5 para backup (pg_dump) e o painel do Supabase.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Log de cada query: ligue com SHOW_SQL=true só para depurar (deixa as respostas lentas).
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
# Sem open-in-view: a conexão do banco só fica presa dentro de @Transactional (não durante chamadas à IA ou ao gateway).
spring.jpa.open-in-view=false

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS}

# Proteção de dados (RETENCAO-DE-DADOS.md)
# Chave do HMAC que pseudonimiza e-mail/CPF nos registros retidos após a exclusão de conta.
# Obrigatória; nunca trocar depois de ir para produção (perde a ligação com o que já foi gravado).
legal.pseudonym-key=${PSEUDONYM_KEY}
# Versão vigente dos Termos de Uso + Política de Privacidade (data da publicação). Ao mudar o
# texto, mude aqui e em kinetic-desktop/src/legal: quem aceitou a versão anterior aceita de novo.
legal.terms-version=2026-10-25

# Supabase Storage (upload de mídia do feed social)
# O bucket precisa ser PRIVADO: o backend entrega URLs assinadas de curta duração,
# geradas só depois de validar que o usuário tem conexão aceita com o autor do post.
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:social-media}
# Bucket PÚBLICO só das fotos de perfil (criar no Supabase como "Public bucket").
supabase.storage.avatars-bucket=${SUPABASE_AVATARS_BUCKET:avatars}
# Validade da URL assinada. Janela em que um link copiado ainda funcionaria após
# a amizade ser desfeita — manter curto, mas acima do tempo de uma rolagem de feed.
supabase.storage.signed-url-ttl-seconds=${SUPABASE_SIGNED_URL_TTL_SECONDS:900}

# Limpeza de mídia órfã (job diário às 05:00)
social.media.cleanup.grace-hours=${MEDIA_CLEANUP_GRACE_HOURS:24}
social.media.cleanup.dry-run=${MEDIA_CLEANUP_DRY_RUN:true}

# Multipart (upload de imagens). App e painel reduzem a foto antes de enviar (~300 KB);
# o teto só barra quem manda o original. Espelhado em StorageService.MAX_FILE_SIZE.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Gemini Configuration
gemini.api.key=${GOOGLE_AI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.models=gemini-3.5-flash,gemini-3-flash-preview,gemini-2.5-flash

# Resend (e-mail transacional: código de recuperação de senha)
# Sem RESEND_API_KEY o pedido de código responde normalmente, mas nada é enviado (só loga erro).
# O remetente precisa ser de um domínio verificado na Resend; onboarding@resend.dev só
# entrega para o e-mail dono da conta Resend (serve apenas para teste).
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM_EMAIL:Kinetic <onboarding@resend.dev>}
resend.base-url=https://api.resend.com
# Só para desenvolvimento: true escreve o texto dos e-mails (com o código) no log do servidor.
resend.dev-log-content=${DEV_LOG_EMAIL_CONTENT:false}

# Atrás de proxy/load balancer (Render, Railway, nginx...), defina SERVER_FORWARD_HEADERS_STRATEGY=native
# para o IP real do cliente (X-Forwarded-For) chegar ao rate limit de /api/auth. Sem proxy, não ligue:
# o cabeçalho viria do próprio cliente e seria forjável.

# CORS Configuration - comma-separated list of allowed origins
# Defaults cobrem o Expo (8081, 19006) e o painel web kinetic-desktop (Vite, 5173).
# Em producao, defina a env CORS_ALLOWED_ORIGINS com as origens reais.
# Cobrança do personal: "demo" (padrão, nada é cobrado) ou "asaas".
billing.gateway=${BILLING_GATEWAY:demo}
billing.trial-days=${BILLING_TRIAL_DAYS:14}
# Asaas (só com billing.gateway=asaas). Sandbox: https://sandbox.asaas.com/api/v3
# Produção: https://api.asaas.com/v3
asaas.base-url=${ASAAS_BASE_URL:https://sandbox.asaas.com/api/v3}
asaas.api-key=${ASAAS_API_KEY:}
asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:5173}

# Seed do usuário ROOT (opcional; sem as variáveis o seed não roda)
root.user.email=${ROOT_USER_EMAIL:}
root.user.password=${ROOT_USER_PASSWORD:}

# Segundo fator (app autenticador) de DONO, EMPRESA e ROOT: chave AES-256 que cifra os segredos
# TOTP no banco. 32 bytes em Base64 (openssl rand -base64 32). Nunca trocar depois de em uso:
# os segredos gravados deixam de abrir e todos precisam recadastrar o app.
totp.encryption-key=${TOTP_ENCRYPTION_KEY:}
# Endereço do painel citado no e-mail com o acesso do dono e das filiais.
app.panel-url=${PANEL_URL:https://kineticfitness.com.br}

# OpenAPI - spec em /v3/api-docs, visualizada pela UI Scalar em /docs.html
# Desligada por padrão: o docs.html carrega script de CDN na mesma origem da API (e do cookie
# de refresh). Ligue com DOCS_ENABLED=true só em desenvolvimento.
docs.enabled=${DOCS_ENABLED:false}
springdoc.api-docs.enabled=${docs.enabled}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
